name: Build SLWF Bosch diagnostic firmware

on:
  push:
    branches:
      - "build/slwf-bosch-debug-20260731"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Mark build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"slwf-firmware-build","description":"ESPHome 2024.4.2 build running"}'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "build/slwf-bosch-debug-20260731"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome 2024.4.2
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > firmware-debug/build-output.txt
          {
            python -m pip install --upgrade pip
            python -m pip install "esphome==2024.4.2"
            esphome version
          } 2>&1 | tee -a firmware-debug/build-output.txt

      - name: Compile diagnostic firmware
        id: compile
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          configs=(
            firmware-debug/klima-eg-kueche-debug.yaml
            firmware-debug/klima-eg-schlafzimmer-debug.yaml
            firmware-debug/klima-eg-kinderzimmer-debug.yaml
            firmware-debug/klima-og-kinderzimmer-01-debug.yaml
          )
          for config in "${configs[@]}"; do
            echo "===== BUILD $config =====" | tee -a firmware-debug/build-output.txt
            esphome compile "$config" 2>&1 | tee -a firmware-debug/build-output.txt
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          done

      - name: Collect OTA binaries
        id: collect
        if: steps.install.outcome == 'success' && steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact
          devices=(
            klima-eg-kueche
            klima-eg-schlafzimmer
            klima-eg-kinderzimmer
            klima-og-kinderzimmer-01
          )
          for dev in "${devices[@]}"; do
            bin="$(find . -type f -path "*/.pioenvs/${dev}/firmware.bin" -print -quit)"
            if [ -z "$bin" ]; then
              echo "firmware.bin for $dev not found" | tee -a firmware-debug/build-output.txt
              find . -type f -name firmware.bin -print | tee -a firmware-debug/build-output.txt
              exit 1
            fi
            cp "$bin" "artifact/${dev}-bosch-midea-debug-ota.bin"
          done
          cp firmware-debug/*.yaml artifact/
          cp firmware-debug/build-output.txt artifact/
          (cd artifact && sha256sum *.bin > SHA256SUMS.txt)
          {
            echo "Built with: $(esphome version)"
            echo "Target: SMLIGHT SLWF-01Pro R2.1 / ESP8266 esp12e"
            echo "UART: GPIO12 TX, GPIO14 RX, 9600 baud"
            echo "Purpose: Bosch Climate 3000iU / Midea raw RX/TX diagnostics"
          } > artifact/BUILDINFO.txt
          ls -lh artifact | tee -a firmware-debug/build-output.txt
          cat artifact/SHA256SUMS.txt | tee -a firmware-debug/build-output.txt

      - name: Upload firmware artifact
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: slwf-bosch-midea-debug-ota
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Persist build result on temporary branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p firmware-debug/artifacts
          cp firmware-debug/build-output.txt firmware-debug/artifacts/build-output.txt || true

          if [ "${{ steps.collect.outcome }}" = "success" ]; then
            cp artifact/* firmware-debug/artifacts/
            rm -f firmware-debug/artifacts/BUILD_FAILED.txt
          else
            printf 'install=%s\ncompile=%s\ncollect=%s\n' \
              "${{ steps.install.outcome }}" \
              "${{ steps.compile.outcome }}" \
              "${{ steps.collect.outcome }}" \
              > firmware-debug/artifacts/BUILD_FAILED.txt
          fi

          git add -f firmware-debug/artifacts
          if git diff --cached --quiet; then
            echo "No build-result changes"
          else
            git commit -m "Persist SLWF firmware build result [skip ci]"
            git push origin HEAD:build/slwf-bosch-debug-20260731
          fi

      - name: Mark build successful
        if: steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"slwf-firmware-build","description":"OTA binaries built successfully"}'

      - name: Mark build failed
        if: steps.collect.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"slwf-firmware-build","description":"Firmware build failed; see temporary build log"}'
          exit 1
