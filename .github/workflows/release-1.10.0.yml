name: Release 1.10.0

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-1.10.0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply hover value and bump version
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/plant-temperature-dial.ts')
          text = path.read_text()

          old_render = '''                  <div class="pointer">\n                    ${this.dragging\n                      ? html`<div class="pointer-value">${this.formatTemperature(target)}</div>`\n                      : nothing}\n                    <div class="pointer-dot"></div>\n                  </div>'''
          new_render = '''                  <div class="pointer">\n                    <div class="pointer-dot"></div>\n                    <div class="pointer-value">${this.formatTemperature(target)}</div>\n                  </div>'''
          if old_render not in text:
              raise SystemExit('Expected pointer render block not found')
          text = text.replace(old_render, new_render, 1)

          old_css = '''    .pointer-dot {\n      width: 8px;\n      height: 8px;\n      margin: 11px 3px 0 auto;\n      border-radius: 50%;\n      background: rgb(154 40 40);\n      transition: width 150ms ease, height 150ms ease, box-shadow 150ms ease;\n    }'''
          new_css = '''    .pointer-dot {\n      width: 8px;\n      height: 8px;\n      margin: 11px 3px 0 auto;\n      border-radius: 50%;\n      background: rgb(154 40 40);\n      pointer-events: auto;\n      transition: width 150ms ease, height 150ms ease, box-shadow 150ms ease;\n    }'''
          if old_css not in text:
              raise SystemExit('Expected pointer-dot CSS block not found')
          text = text.replace(old_css, new_css, 1)

          old_value_css = '''    .pointer-value {\n      position: absolute;\n      right: 18px;\n      top: -3px;\n      font-family: Roboto, sans-serif;\n      font-size: 10px;\n      font-variant-numeric: tabular-nums;\n      transform: rotate(80deg);\n      transform-origin: center;\n    }\n\n    .dragging .pointer-value {\n      font-size: 13px;\n      font-weight: 600;\n    }'''
          new_value_css = '''    .pointer-value {\n      position: absolute;\n      right: 18px;\n      top: -3px;\n      opacity: 0;\n      visibility: hidden;\n      font-family: Roboto, sans-serif;\n      font-size: 10px;\n      font-variant-numeric: tabular-nums;\n      transform: rotate(80deg);\n      transform-origin: center;\n      transition: opacity 120ms ease;\n      pointer-events: none;\n    }\n\n    .pointer-dot:hover + .pointer-value,\n    .dragging .pointer-value {\n      opacity: 1;\n      visibility: visible;\n    }\n\n    .dragging .pointer-value {\n      font-size: 13px;\n      font-weight: 600;\n    }'''
          if old_value_css not in text:
              raise SystemExit('Expected pointer-value CSS block not found')
          text = text.replace(old_value_css, new_value_css, 1)
          path.write_text(text)

          card = Path('src/plant-climate-card.ts')
          card_text = card.read_text()
          card_text = re.sub(r'const VERSION = "[^"]+";', 'const VERSION = "1.10.0";', card_text, count=1)
          card.write_text(card_text)

          readme = Path('README.md')
          readme_text = readme.read_text()
          readme_text = re.sub(r'plant-climate-card\.js\?v=\d+\.\d+\.\d+', 'plant-climate-card.js?v=1.10.0', readme_text)
          readme.write_text(readme_text)
          PY

          npm version 1.10.0 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Prepare release commit
        run: |
          rm -f .release-1.10.0-trigger
          rm -f .github/workflows/release-1.10.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.10.0"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a 1.10.0 -m "Plant Climate Card 1.10.0"
          git push origin 1.10.0
          gh release create 1.10.0 plant-climate-card.js \
            --verify-tag \
            --title "Plant Climate Card 1.10.0" \
            --notes "UX improvement for the temperature dial:\n\n- hovering the red temperature handle now shows the selected target temperature\n- the same target value remains visible while dragging\n- touch behavior is unchanged"
